schema: spec-driven

context: |
  livewire.nvim: a Neovim plugin (Lua) adding Livewire 4 support to Blade files.
  Background, prior art and requirements: docs/research.md.
  Targets Neovim 0.11+ and blink.cmp v1 (LazyVim). Developed against a local
  Livewire 4.4.8 project at ~/Lerd/livewire. Existing component/member resolution
  logic to absorb lives in ~/.config/nvim/lua/config/components.lua.

